@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap');

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

    font-family: 'Outfit', sans-serif;

  background:
  radial-gradient(circle at top left,#f3f3f3,#ffffff 45%);

  overflow-x:hidden;

  color:#111;
   position:relative;
}

/* ================= NAVBAR ================= */

.navbar{

  width:100%;

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:22px 40px;

  background:#fff;

  position:relative;

  z-index:2000;
}

.logo{

  display:flex;

  align-items:center;

  text-decoration:none;
}

.logo-img{

  width:60px;

  margin-right:12px;
}

.logo-text-img{

  height:66px;

  width:auto;
}

/* MENU */

.menu{

  display:flex;

  align-items:center;

  gap: 40px;
}

.menu a{
    position:relative;
    text-decoration:none;
    color:#111;
    font-size:15px;
    font-weight:500;
    letter-spacing:.5px;
    padding:6px 0;
    transition:.3s ease;
}

.menu a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-8px;
    width:100%;
    height:2px;
    background:#111;
    transform:scaleX(0);
    transform-origin:left;
    transition:transform .35s ease;
}

.menu a:hover{
color:#000;
  opacity:0.6;
}

.menu a:hover::after{
    transform:scaleX(1);
}

/* HAMBURGER */

.hamburger{
    display:none;
    font-size:42px;
    font-weight:400;
    line-height:1;
    cursor:pointer;
    color:#000;
    z-index:2001;
    background:none;
    border:none;
    padding:0;
}


/* ================= MOBILE MENU ================= */

.menu-overlay{

  position:fixed;

  top:0;
  left:0;

  width:100%;
  height:100%;

  background:rgba(0,0,0,0.45);

  opacity:0;

  visibility:hidden;

  transition:0.3s;

  z-index:999;
}

.side-menu{

  position:fixed;

  top:0;
  right:-100%;

  width:80%;
  height:100%;

  background:white;

  padding:90px 40px;

  display:flex;

  flex-direction:column;

  gap:45px;

  transition:0.45s ease;

  z-index:1000;
}

.side-menu a{

  text-decoration:none;

  color:#111;

  font-size:22px;
}

.close-btn{

  position:absolute;

  top:25px;
  right:25px;

  font-size:30px;

  cursor:pointer;
}

.side-menu.active{

  right:0;
}

.menu-overlay.active{

  opacity:1;

  visibility:visible;
}

/* ================= PUBLICATION SECTION ================= */

.publications-section{

  width:100%;

  max-width:1280px;

  margin:100px auto;

  padding:0 40px 120px;
}

/* HEADING */

.publication-heading{

  text-align:center;

  font-size:64px;

  letter-spacing:12px;

  font-weight:200;

  margin-bottom:90px;

  color:#111;
}

/* CARD */


.publication-card{

  position:relative;

  display:grid;

  grid-template-columns:1.1fr 1fr;

  gap:60px;

  align-items:center;

  margin-bottom:90px;

  padding:35px;

  border-radius:34px;

  background:
  rgba(255,255,255,0.65);

  backdrop-filter:blur(14px);

  border:1px solid rgba(255,255,255,0.5);

  box-shadow:
  0 10px 40px rgba(0,0,0,0.08);

  overflow:hidden;

  transition:
  transform 0.6s cubic-bezier(0.16,1,0.3,1),
  box-shadow 0.6s ease;
}

/* HOVER */

.publication-card:hover{

  transform:translateY(-10px);

  box-shadow:
  0 18px 60px rgba(0,0,0,0.14);
}

/* ALTERNATE LAYOUT */

.publication-card:nth-child(even)
.publication-image{

  order:2;
}

.publication-card:nth-child(even)
.publication-content{

  order:1;
}

/* IMAGE */

.publication-image{

  width: 520px;
    height: 520px;
    object-fit: cover;
    display: block;
    margin: auto;
     border-radius:50%;
border:0px solid #e8e8e8;

    /* Organic Circle Shape */
    /* border-radius: 58% 42% 63% 37% / 42% 58% 42% 58%; */
 /* border:8px solid #fff;   White border */
    /* box-shadow:
        0 20px 60px rgba(0,0,0,.15),
        0 0 0 2px #f1f1f1;    Light outline */
    /* overflow: hidden; */

    /* box-shadow: 0 25px 60px rgba(0,0,0,.12); */

    /* transition: all .6s ease; */
     /* background: transparent; */
     /* object-fit:contain; */
    /* object-position:center; */
}

.aii-logo{
  object-fit:contain !important;
  padding:15px;
}

.publication-card:hover
.publication-image{

  transform: scale(1.05) ;
}

/* CONTENT */

.publication-content{

  padding:10px 20px;
}

/* TAG */

.publication-tag{

  display:inline-block;

  margin-bottom:24px;

  padding:10px 18px;

  border-radius:40px;

  background:#111;

  color:#fff;

  font-size:11px;

  letter-spacing:3px;

  font-weight:600;
}

/* TITLE */

.publication-content h2{

  margin:0 0 24px;

  font-size:64px;

  line-height:1;

  font-weight:300;

  letter-spacing:-3px;

  color:#111;
}

/* TEXT */

.publication-content p{

  font-size:17px;

  line-height:2;

  color:#666;

  margin-bottom:36px;

  max-width:520px;
}

/* BUTTON */

.publication-content a{

  display:inline-flex;

  align-items:center;

  gap:12px;

  text-decoration:none;

  color:#111;

  font-size:14px;

  font-weight:700;

  letter-spacing:3px;

  text-transform:uppercase;

  transition:0.35s ease;
}

.publication-content a::after{

  content:"→";

  transition:0.35s ease;
}

.publication-content a:hover{

  letter-spacing:5px;
}

.publication-content a:hover::after{

  transform:translateX(8px);
}

.publication-gallery{
    width:100%;
    height:85vh;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    overflow:hidden;
}

.gallery-track{
    position:relative;
    width:100%;
    height:100%;
}

.gallery-img{
    width:120px;
    height:120px;
    border-radius:50%;
    object-fit:cover;
    transition:.35s;
    opacity:.4;
}

.gallery-item.active .gallery-img{
    width:320px;
    height:320px;
    opacity:1;
}

.arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:55px;
    height:55px;
    border:none;
    background:none;
    font-size:45px;
    cursor:pointer;
    z-index:100;
}

.prev{
    left:20px;
}

.next{
    right:20px;
}

.arrow:hover{

transform:scale(1.2);

}

.grid-lines{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:space-evenly;
    pointer-events:none;
    z-index:0;
}

.grid-lines span{
    width:0;
    height:100%;
    border-left:2px dashed rgba(0,0,0,.25);
}

.gallery-item{
    position:absolute;
    top:50%;
    transform:translate(-50%,-50%);
}

/* .sketch{
  width:100%;
  display:block;
  transition:.5s;
} */

.sketch{
    width:320px;
    height:320px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    transition:.5s;
}

.publication-circle{
   position:absolute;
    left:50%;
    top:50%;
    width:320px;
    height:320px;
    border-radius:50%;
    object-fit:cover;
    transform:translate(-50%,-50%) scale(.8);
    opacity:0;
    transition:.5s;
}

.gallery-item:hover .sketch{
    opacity:.2;
}

.gallery-item:hover .publication-circle{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

.item1{
    left:16.66%;
}

.item2{
    left:33.33%;
}

.item3{
    left:50%;
}

.item4{
    left:66.66%;
}
/* Active image */
.gallery-item.active .gallery-img{
    width:320px;
    height:320px;
    opacity:1;
    transform:scale(1);
}

/* Inactive images */
.gallery-item .gallery-img{
    width:320px;
    height:320px;
    opacity:1;
    transform:scale(1);
}

  }

  .publication-image{

    font-size:36px;

    line-height:1.1;
  }

  .publication-content p{

    font-size:15px;

    line-height:1.8;

const items = document.querySelectorAll(".gallery-item");
let current = 0;

function update(){

    items.forEach(item=>{
        item.classList.remove("active");
    });

    items[current].classList.add("active");
}

document.querySelector(".next").onclick = ()=>{

    current++;

    if(current >= items.length)
        current = 0;

    update();
}

document.querySelector(".prev").onclick = ()=>{

    current--;

    if(current < 0)
        current = items.length - 1;

    update();
}

update();

</script>
