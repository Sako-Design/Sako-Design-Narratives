<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Architecture | Sako Design Narratives</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap">
<style>
/* ===== 5 cards always tile the screen; l1..l5 = centre of each card = the 5 grid lines ===== */
:root{
  --nav-h:106px;
  --pad:clamp(40px,5vw,120px);
  --gap:clamp(20px,2.2vw,40px);
  --w:calc((100vw - 2*var(--pad) - 4*var(--gap)) / 5);
  --l1:calc(var(--pad) + var(--w)/2);
  --l2:calc(var(--l1) + var(--w) + var(--gap));
  --l3:calc(var(--l2) + var(--w) + var(--gap));
  --l4:calc(var(--l3) + var(--w) + var(--gap));
  --l5:calc(var(--l4) + var(--w) + var(--gap));
  --img:clamp(260px,26vw,500px);      /* home image size   */
  --c:clamp(260px,23vw,340px);        /* opened circle size */
  --dash:repeating-linear-gradient(to bottom,#555 0,#555 6px,transparent 6px,transparent 12px);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Outfit',sans-serif;background:#fff;color:#000;overflow:hidden;height:100vh}

/* ===== NAVBAR ===== */
.navbar{position:fixed;top:0;left:0;width:100%;height:var(--nav-h);padding:20px 40px;display:flex;justify-content:space-between;align-items:center;background:#fff;z-index:10000}
.logo{display:flex;align-items:center;text-decoration:none;color:inherit;flex-shrink:0}
.logo-img{width:60px;height:auto;margin-right:12px;mix-blend-mode:multiply}
.logo-text-img{height:66px;width:auto;display:block}
.menu{display:flex;align-items:center;gap:35px}
.menu a{color:#000;text-decoration:none;font-size:14px;white-space:nowrap}
.menu a:hover{text-decoration:underline}
.menu a.current{font-weight:400}
.hamburger{display:none;font-size:28px;cursor:pointer;margin-left:auto}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;visibility:hidden;transition:.3s;z-index:10001}
.side-menu{position:fixed;top:0;right:-100%;width:80%;height:100%;background:#fff;padding:80px 40px;display:flex;flex-direction:column;gap:45px;transition:.4s ease;z-index:10002}
.side-menu a{text-decoration:none;color:#000;font-size:22px}
.close-btn{position:absolute;top:25px;right:25px;font-size:30px;cursor:pointer}
.side-menu.active{right:0}
.menu-overlay.active{opacity:1;visibility:visible}

/* ===== ARROWS / CLOSE ===== */
.arrow{position:fixed;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.9);font-size:26px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:1000000}
.arrow.show{display:flex}
.arrow:hover{background:grey;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.left{left:7px}.right{right:7px}
.close-project{position:fixed;top:calc(var(--nav-h) + 14px);right:16px;width:38px;height:38px;border:1px solid #999;border-radius:50%;background:#fff;font-size:18px;cursor:pointer;display:none;align-items:center;justify-content:center;z-index:6000}

/* ===== SHARED CARD PARTS ===== */
.project-item{position:relative;cursor:pointer}
.img-box{position:relative}
.img-box img{position:absolute;top:50%;left:50%;max-width:none;object-fit:contain;transform:translate(-50%,-50%);transition:opacity .4s ease}
.sketch-img{opacity:1;z-index:2}
.color-img{opacity:0;z-index:3;pointer-events:none}
.grid-line{position:absolute;left:calc(50% - .5px);top:-600px;bottom:-600px;width:1px;background:var(--dash);z-index:10;pointer-events:none}
.project-title{font-size:14px;font-weight:400}
.mobile-project-details{display:none}
.project-info{font-size:14px;line-height:1.6;color:#222}
.project-info p{margin:0 0 8px}
.project-info .about{margin-top:14px}
.mobile-slider{display:none}
.gallery-caption{margin:0;font-size:14px;line-height:1.7;color:#333}
.similar-projects h2{margin:0 0 28px;font-size:22px;font-weight:400}
.similar-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:22px}
.similar-card{cursor:pointer}
.similar-card img{width:100%;height:180px;object-fit:contain;display:block}
.similar-card span{display:block;margin-top:12px;font-size:13px}
.similar-card:hover span{text-decoration:underline}
.project-socials,.site-footer{background:#000;display:flex;justify-content:center;gap:25px;padding:20px 0}
.project-socials a,.site-footer a{width:30px;height:30px;border:1px solid #a56243;border-radius:50%;color:#a56243;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:16px;transition:.3s}
.project-socials a:hover,.site-footer a:hover{background:#a56243;color:#fff;transform:translateY(-4px)}
.site-footer{display:none}

/* ===================== DESKTOP ===================== */
@media (min-width:891px){
    .grid-line{display:none}
      body:not(.project-open)::before{content:"";position:fixed;top:var(--nav-h);bottom:0;left:0;right:0;pointer-events:none;z-index:5000;
    background-image:var(--dash),var(--dash),var(--dash),var(--dash),var(--dash);background-repeat:no-repeat;background-size:1px 100%;
    background-position:calc(var(--l1) - .5px) 0,calc(var(--l2) - .5px) 0,calc(var(--l3) - .5px) 0,calc(var(--l4) - .5px) 0,calc(var(--l5) - .5px) 0}
  .projects{display:flex;gap:var(--gap);height:100vh;padding:var(--nav-h) var(--pad) 0;align-items:center;overflow:hidden}
  .project-item{flex:0 0 var(--w);width:var(--w);height:372px;top:60px;z-index:2}
  .img-box{width:100%;height:170px}
  .img-box img{width:var(--img);height:var(--img)}
  /* baseline that joins the 5 houses */
  .project-item:not(.desktop-active) .img-box::after{content:"";position:absolute;top:calc(85px + .179*var(--img));left:calc(var(--gap)/-2);width:calc(100% + var(--gap));height:1px;background:rgba(120,120,120,.55)}
  .project-title{position:absolute;left:0;width:100%;text-align:center;top:calc(85px + .179*var(--img) + 70px);z-index:3}
  @media (hover:hover){
    .project-item:not(.desktop-active) .img-box:hover .sketch-img{opacity:0}
    .project-item:not(.desktop-active) .img-box:hover .color-img{opacity:1}
  }

  /* ---- opened project ---- */
  body.project-open .project-item:not(.desktop-active){visibility:hidden}
  body.project-open::after{content:"";position:fixed;top:var(--nav-h);bottom:0;left:0;right:0;pointer-events:none;z-index:5000;
    background-image:var(--dash),var(--dash),var(--dash),var(--dash),var(--dash);background-repeat:no-repeat;background-size:1px 100%;
    background-position:calc(var(--l1) - .5px) 0,calc(var(--l2) - .5px) 0,calc(var(--l3) - .5px) 0,calc(var(--l4) - .5px) 0,calc(var(--l5) - .5px) 0}
  body.project-open .close-project{display:flex}
  .project-item.desktop-active{position:fixed;top:var(--nav-h);left:0;width:100vw;height:calc(100vh - var(--nav-h));z-index:1000;cursor:default;overflow:hidden;animation:open .8s ease}
  @keyframes open{from{transform:translateY(30px);filter:blur(6px)}}
  @keyframes fade{from{opacity:0;transform:translateY(14px)}}
  .desktop-active .img-box{position:absolute;left:calc((var(--l2) - var(--c))/2);top:0;width:var(--c);height:var(--c);z-index:1001;cursor:pointer;animation:fade 1s ease both}
  .desktop-active .img-box img{width:var(--c);height:var(--c)}
  .desktop-active .sketch-img{opacity:0}
  .desktop-active .color-img{opacity:1}
  .desktop-active .grid-line{display:none}
  .project-item.desktop-active::after{content:"";position:absolute;top:calc(.679*var(--c));left:calc(var(--l2)/2 - 40px);right:0;height:1px;background:#999;z-index:1;transition:opacity .25s}
  .project-item.desktop-active.scrolled::after{opacity:0}
  .desktop-active .project-title{left:28px;width:calc(var(--l2) - 56px);text-align:left;top:calc(.679*var(--c) + 22px);font-size:16px;z-index:1001;animation:fade 1s ease .3s both}
  .desktop-active .mobile-project-details{display:block;position:absolute;left:28px;width:calc(var(--l2) - 56px);top:calc(.679*var(--c) + 58px);z-index:1001;animation:fade 1s ease .6s both}
  @media (max-height:800px){.project-info{font-size:13px;line-height:1.45}.project-info p{margin-bottom:5px}}
  /* right side: vertical gallery, scrolls between line 2 and line 5 */
    .desktop-active .mobile-slider{display:flex;flex-direction:column;gap:48px;position:absolute;inset:0;z-index:1002;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;
    padding:calc(.679*var(--c) + 22px) calc(100vw - var(--l5)) 0 var(--l2)}
  .desktop-active .mobile-slider{pointer-events:none}
  .desktop-active .slider-image,.desktop-active .similar-projects,.desktop-active .project-socials{pointer-events:auto}
  .mobile-slider::-webkit-scrollbar{display:none}
  .mobile-slider .slider-image{display:block;width:100%;height:auto;max-height:82vh;object-fit:contain}
  .slide-btn{display:none!important}
  .desktop-active .similar-projects{flex-shrink:0;width:100vw;margin:30px 0 0 calc(-1*var(--l2));padding:0 35px 40px;background:#fff}
  .desktop-active .project-socials{flex-shrink:0;width:100vw;margin-left:calc(-1*var(--l2))}
    .desktop-active .similar-projects{position:relative;z-index:2;background:#fff;padding-top:30px}
}

/* ===================== MOBILE ===================== */
@media (max-width:890px){
  body{overflow-x:hidden;overflow-y:auto;height:auto}
  .navbar{padding:15px 20px;height:80px}
  .logo{max-width:70%}.logo-img{width:50px;height:50px}.logo-text-img{height:50px}
  .menu{display:none}.hamburger{display:block}
  .projects{display:flex;width:100vw;padding-top:80px;overflow-x:auto;align-items:flex-start;scroll-snap-type:x mandatory;scrollbar-width:none}
  .projects::-webkit-scrollbar{display:none}
  .project-item{flex:0 0 100vw;width:100vw;padding-bottom:60px;scroll-snap-align:start}
  .img-box{height:320px}
  .img-box img{width:220px;height:auto;max-height:330px}
  .grid-line{display:none}
  .project-title{margin-top:20px;padding-left:6%;font-weight:600}
  .project-item.active .sketch-img{opacity:0}
  .project-item.active .color-img{opacity:1}
  .project-item.active .mobile-project-details{display:block;width:88%;margin:20px auto 0;animation:up .8s ease both}
  @keyframes up{from{opacity:0;transform:translateY(30px)}}
  .project-item.active .mobile-slider{display:block;position:relative;width:100vw;height:340px;margin-top:30px;overflow:hidden}
  .slider-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease}
  .slider-image.on{opacity:1;z-index:2}
  .gallery-caption,.similar-projects,.project-socials{display:none}
  .slide-btn{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.95);z-index:9999;display:flex;align-items:center;justify-content:center;font-size:20px}
  .prev-btn{left:16px}.next-btn{right:16px}
  .site-footer{display:flex}
}
</style>
</head>
<body>

<header class="navbar">
  <a href="index.html" class="logo">
    <img src="./images/logo.png" alt="Sako Logo" class="logo-img">
    <img src="./images/logo-text.png" alt="Sako Design Narratives" class="logo-text-img">
  </a>
  <nav class="menu">
    <a href="index.html">Home</a>
    <a href="architecture.html" class="current">Architecture</a>
    <a href="interior.html">Interior</a>
    <a href="research.html">Research</a>
    <a href="about.html">About</a>
    <a href="publication.html">Publication</a>
    <a href="contact.html">Contact</a>
  </nav>
  <div class="hamburger" id="hamburger">☰</div>
</header>
<div class="menu-overlay" id="overlay"></div>
<nav class="side-menu" id="sideMenu">
  <div class="close-btn" id="closeMenu">✕</div>
  <a href="index.html">Home</a><a href="architecture.html">Architecture</a><a href="interior.html">Interior</a>
  <a href="research.html">Research</a><a href="about.html">About</a><a href="publication.html">Publication</a><a href="contact.html">Contact</a>
</nav>

<button type="button" class="arrow left" aria-label="Previous">&#10094;</button>
<button type="button" class="arrow right" aria-label="Next">&#10095;</button>
<button type="button" class="close-project" aria-label="Close project">✕</button>

<!-- cards are generated from the PROJECTS list below -->
<section class="projects" id="projects"></section>

<footer class="site-footer">
  <a href="#"><i class="fab fa-facebook-f"></i></a><a href="#"><i class="fas fa-envelope"></i></a>
  <a href="#"><i class="fab fa-instagram"></i></a><a href="#"><i class="fas fa-briefcase"></i></a>
</footer>

<script>
/* ================= YOUR 5 ARCHITECTURE PROJECTS =================
   To change a project edit the lines below. Optional per project:
   info:[["Label","value"],...]   about:"text"   gallery items can be "img.jpg" or ["img.jpg","caption"] */
const DEFAULT_INFO = [
  ["Project Name","SaKo studio"],
  ["Studio Name","Sako design narratives"],
  ["Location","Hyderabad Completed in – Feb, 2023"],
  ["Project Size","250 sq ft"],
  ["Principal Architects","Sangeetha Polisetti, Kondal Siddhuri"],
  ["Photograph Courtesy","Akshay Adimula"]
];
const DEFAULT_ABOUT = "Nestled within a dense urban neighborhood in the heart of Hyderabad, sako Studio is a compact 250 sq ft workspace designed for efficiency and style.";
const O = ["./images/o1.jpg","./images/o2.jpeg","./images/o3.jpeg","./images/o4.jpeg"];

const PROJECTS = [
  { name:"Sako Office, Hyderabad",   sketch:"./images/sketch door.jpeg",  color:"./images/color door.jpeg",  gallery:O },
  { name:"Farmhouse Panjarla, India", sketch:"./images/sketch house.jpeg", color:"./images/color house.jpeg", gallery:["./Panjarla Farmhouse/1.jpeg","./Panjarla Farmhouse/2.jpeg","./Panjarla Farmhouse/3.jpeg","./Panjarla Farmhouse/4.jpeg"] },
  { name:"Villa Maheshwaram, India",  sketch:"./images/3.1.png",           color:"./images/3 (1).png",        gallery:O },
  { name:"Lakeview Farmhouse, India", sketch:"./images/4.1.png",           color:"./images/4 (1).png",        gallery:O },
  { name:"NCC Yard, India",           sketch:"./images/5.1.png",           color:"./images/5 (1).png",        gallery:["./ncc yard/AAA09578-HDR-1.jpg","./ncc yard/AAA09648-HDR-20.jpg","./ncc yard/AAA09651-HDR-21.jpg","./ncc yard/AAA09717-HDR-35-5.jpg"] }
];

/* ================= BUILD CARDS ================= */
const SOCIAL = '<a href="#"><i class="fab fa-facebook-f"></i></a><a href="#"><i class="fas fa-envelope"></i></a><a href="#"><i class="fab fa-instagram"></i></a><a href="#"><i class="fas fa-briefcase"></i></a>';
const projectsEl = document.getElementById("projects");

projectsEl.innerHTML = PROJECTS.map((p, i) => {
  const info = (p.info || DEFAULT_INFO).map(([k, v]) => `<p><b>${k} –</b> ${v}</p>`).join("");
  const gallery = p.gallery.map((g, j) => {
    const [src, cap] = Array.isArray(g) ? g : [g, ""];
    return `<img src="${src}" class="slider-image${j ? "" : " on"}" alt="${p.name}">` + (cap ? `<p class="gallery-caption">${cap}</p>` : "");
  }).join("");
  const similar = PROJECTS.map((q, j) => j === i ? "" :
    `<div class="similar-card" data-go="${j}"><img src="${q.sketch}" alt="${q.name}"><span>${q.name}</span></div>`).join("");
  return `
  <div class="project-item" data-i="${i}">
    <div class="img-box">
      <img src="${p.sketch}" class="sketch-img" alt="${p.name}">
      <img src="${p.color}" class="color-img" alt="">
      <div class="grid-line"></div>
    </div>
    <div class="project-title">${p.name}</div>
    <div class="mobile-project-details"><div class="project-info">${info}<p class="about">${p.about || DEFAULT_ABOUT}</p></div></div>
    <div class="mobile-slider">
      <button class="slide-btn prev-btn">&#10094;</button>
      ${gallery}
      <button class="slide-btn next-btn">&#10095;</button>
      <section class="similar-projects"><h2>Similar Projects</h2><div class="similar-grid">${similar}</div></section>
      <div class="project-socials">${SOCIAL}</div>
    </div>
  </div>`;
}).join("");

/* ================= OPEN / CLOSE (no looping) ================= */
const cards = [...document.querySelectorAll(".project-item")];
const L = document.querySelector(".arrow.left"), R = document.querySelector(".arrow.right");
const isDesk = () => innerWidth > 890;
let cur = -1;

function updateArrows() {
  const open = cur > -1 && isDesk();
  L.classList.toggle("show", isDesk() ? open && cur > 0 : true);
  R.classList.toggle("show", isDesk() ? open && cur < cards.length - 1 : true);
}

function setOpen(i) {
  cards.forEach(c => c.classList.remove("desktop-active", "active", "scrolled"));
  cur = i;
  document.body.classList.toggle("project-open", i > -1 && isDesk());
  if (i > -1) {
    cards[i].classList.add(isDesk() ? "desktop-active" : "active");
    cards[i].querySelector(".mobile-slider").scrollTop = 0;
  }
  updateArrows();
}

function scrollRow(d) {
  projectsEl.scrollBy({ left: d * cards[0].offsetWidth, behavior: "smooth" });
}

R.addEventListener("click", () => {
  if (document.body.classList.contains("project-open")) { if (cur < cards.length - 1) setOpen(cur + 1); }
  else scrollRow(1);
});
L.addEventListener("click", () => {
  if (document.body.classList.contains("project-open")) { if (cur > 0) setOpen(cur - 1); }
  else scrollRow(-1);
});
document.querySelector(".close-project").addEventListener("click", () => setOpen(-1));
document.addEventListener("keydown", e => { if (e.key === "Escape") setOpen(-1); });

projectsEl.addEventListener("click", e => {
  const go = e.target.closest(".similar-card");
  if (go) { setOpen(+go.dataset.go); return; }
  if (e.target.closest(".slide-btn")) return;
  const card = e.target.closest(".project-item");
  if (!card) return;
  if (card.classList.contains("desktop-active")) { if (e.target.closest(".img-box")) setOpen(-1); return; }
  if (card.classList.contains("active")) { if (!e.target.closest(".mobile-slider")) setOpen(-1); return; }
  setOpen(+card.dataset.i);
});

/* wheel over the left column also scrolls the gallery */
addEventListener("wheel", e => {
  if (cur < 0 || !isDesk()) return;
  const s = cards[cur].querySelector(".mobile-slider");
  if (!s.contains(e.target)) s.scrollTop += e.deltaY;
}, { passive: true });

/* header line fades once the gallery scrolls */
document.querySelectorAll(".mobile-slider").forEach(s =>
  s.addEventListener("scroll", () => s.parentElement.classList.toggle("scrolled", s.scrollTop > 2), { passive: true }));

/* mobile: one image at a time with arrows */
document.querySelectorAll(".mobile-slider").forEach(s => {
  const im = [...s.querySelectorAll(".slider-image")];
  let k = 0, t;
  const show = n => { k = (n + im.length) % im.length; im.forEach((x, j) => x.classList.toggle("on", j === k)); };
  const auto = () => { clearInterval(t); t = setInterval(() => { if (!isDesk()) show(k + 1); }, 3000); };
  s.querySelector(".next-btn").addEventListener("click", e => { e.stopPropagation(); show(k + 1); auto(); });
  s.querySelector(".prev-btn").addEventListener("click", e => { e.stopPropagation(); show(k - 1); auto(); });
  auto();
});

let wasDesk = isDesk();
addEventListener("resize", () => { if (isDesk() !== wasDesk) { wasDesk = isDesk(); setOpen(-1); } });
updateArrows();

/* ================= HAMBURGER MENU ================= */
const hamburger = document.getElementById("hamburger"), sideMenu = document.getElementById("sideMenu"), overlay = document.getElementById("overlay");
const toggleMenu = on => { sideMenu.classList.toggle("active", on); overlay.classList.toggle("active", on); hamburger.style.display = on ? "none" : ""; };
hamburger.addEventListener("click", () => toggleMenu(true));
document.getElementById("closeMenu").addEventListener("click", () => toggleMenu(false));
overlay.addEventListener("click", () => toggleMenu(false));
</script>
</body>
</html>
